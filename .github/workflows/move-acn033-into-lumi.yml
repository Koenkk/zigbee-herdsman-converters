name: Move acn033 definition into lumi

on:
  push:
    branches:
      - support-lumi-light-acn033

permissions:
  contents: write

jobs:
  move-definition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: support-lumi-light-acn033
      - name: Move definition into lumi.ts
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/devices/lumi.ts')
          text = path.read_text()
          marker = '''    {\n        zigbeeModel: ["lumi.light.cwac02", "lumi.light.acn014"],\n'''
          if 'zigbeeModel: ["lumi.light.acn033"]' not in text:
              block = '''    {\n        zigbeeModel: ["lumi.light.acn033"],\n        model: "lumi.light.acn033",\n        vendor: "Aqara",\n        description: "Ceiling light H1",\n        extend: [\n            lumi.modernExtend.addManuSpecificLumiCluster(),\n            m.light({colorTemp: {range: [153, 370], startup: false}, effect: false, powerOnBehavior: false}),\n            lumiPowerOnBehavior(),\n            lumiZigbeeOTA(),\n        ],\n    },\n'''
              if marker not in text:
                  raise SystemExit('Insertion marker not found')
              text = text.replace(marker, block + marker, 1)
              path.write_text(text)

          separate = Path('src/devices/aqara_h1_ceiling_light.ts')
          if separate.exists():
              separate.unlink()

          workflow = Path('.github/workflows/move-acn033-into-lumi.yml')
          if workflow.exists():
              workflow.unlink()
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: move Aqara H1 definition into lumi.ts" || exit 0
          git push origin HEAD:support-lumi-light-acn033
