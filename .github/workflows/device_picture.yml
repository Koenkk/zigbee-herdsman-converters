name: Device picture

# New devices (`feat(add): MODEL` PRs) require a 512x512 PNG picture in the PR description.
# Upon merge the picture is committed to zigbee2mqtt.io (public/images/devices).

on:
    pull_request_target:
        types:
            - opened
            - edited
            - reopened
            - synchronize
            - ready_for_review
            - closed

permissions:
    contents: read
    pull-requests: write

jobs:
    check:
        if: github.event.action != 'closed' && startsWith(github.event.pull_request.title, 'feat(add)')
        runs-on: ubuntu-latest
        # The PR title workflow often edits the title right after opening, avoid racing runs posting duplicate comments.
        # Only for this job: the upload job must never be cancelled by a later event.
        concurrency:
            group: device-picture-check-${{ github.event.pull_request.number }}
            cancel-in-progress: true
        # pull_request_target runs in base-repo context: this checks out the base branch (for the script), never PR code.
        steps:
            - uses: actions/checkout@v7
              with:
                  sparse-checkout: .github/scripts
            - name: Check device picture
              uses: actions/github-script@v9
              with:
                  script: |
                      const {check} = require("./.github/scripts/device_picture.cjs");
                      await check({github, context, core});

    upload:
        if: github.event.action == 'closed' && github.event.pull_request.merged && startsWith(github.event.pull_request.title, 'feat(add)')
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  sparse-checkout: .github/scripts
            - name: Upload device picture to zigbee2mqtt.io
              uses: actions/github-script@v9
              env:
                  DOCS_TOKEN: ${{ secrets.GH_TOKEN }}
              with:
                  script: |
                      const {upload} = require("./.github/scripts/device_picture.cjs");
                      await upload({github, context, core, docsGithub: getOctokit(process.env.DOCS_TOKEN)});
