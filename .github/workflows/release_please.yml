name: Release Please

on:
    push:
        branches:
            - master

permissions:
    contents: write
    pull-requests: write

jobs:
    release-please:
        if: github.repository == 'Koenkk/zigbee-herdsman-converters'
        runs-on: ubuntu-latest
        steps:
            - uses: googleapis/release-please-action@v5
              with:
                  token: ${{ secrets.GH_TOKEN }}
